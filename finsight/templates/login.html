<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finsightpro 登录</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #D6DEEB 40%, #F8F6F6 60%);
            overflow: hidden;
        }

        /* 左侧面板 */
        .left-panel {
            flex: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background-color: #D6DEEB;
            position: relative;
            overflow: hidden;
            padding: 40px;
        }

        .login-logo {
            width: min(320px, 64vw);
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 16px 28px rgba(19, 40, 67, 0.18));
            animation: fadeIn 1.1s ease-in-out;
        }

        .left-panel h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 6rem;
            color: #132843;
            margin: 0;
            white-space: nowrap;
            animation: fadeIn 1.2s ease-in-out;
            position: relative;
        }

        .left-panel h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 0;
            height: 4px;
            background-color: #132843;
            animation: lineGrow 1.5s ease-in-out forwards;
            animation-delay: 0.8s;
        }

        /* 右侧面板 */
        .right-panel {
            flex: 6;
            position: relative;
            background-color: #F8F6F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: slideIn 1s ease-in-out;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            left: -50px;
            top: 0;
            bottom: 0;
            width: 100px;
            background: linear-gradient(to right, 
                #D6DEEB 0%, 
                #F8F6F6 100%
            );
            border-radius: 0 100% 100% 0;
            box-shadow: 5px 0 15px rgba(19,40,67,0.12);
        }

        .right-panel h2 {
            font-family: 'Brush Script MT', cursive;
            font-size: 4rem;
            margin: 0;
            color: #132843;
            animation: fadeInUp 1s ease-in-out;
        }

        .right-panel form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60%;
            margin-top: 40px;
        }

        .right-panel input {
            width: 100%;
            padding: 15px 0;
            margin: 20px 0;
            border: none;
            border-bottom: 2px solid #6191D3;
            font-size: 1rem;
            background: transparent;
            transition: all 0.3s ease;
            position: relative;
            animation: fadeInUp 1s ease-in-out;
            animation-fill-mode: both;
        }

        .right-panel input:nth-child(1) {
            animation-delay: 0.2s;
        }

        .right-panel input:nth-child(2) {
            animation-delay: 0.4s;
        }

        .right-panel input:focus {
            outline: none;
            border-bottom: 2px solid #132843;
            transform: translateY(-5px);
        }

        .input-group {
            width: 100%;
            position: relative;
        }

        .error-message {
            color: #3966A2;
            font-size: 0.8rem;
            position: absolute;
            bottom: 0px;
            left: 0;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .right-panel button {
            width: 100%;
            padding: 15px 0;
            margin: 25px 0;
            background-color: #6191D3;
            border: none;
            color: #F8F6F6;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-in-out;
            animation-delay: 0.6s;
            animation-fill-mode: both;
        }

        .right-panel button:hover {
            background-color: #3966A2;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(57, 102, 162, 0.24);
        }

        .right-panel button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(57, 102, 162, 0.24);
        }

        .right-panel button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(248, 246, 246, 0.55);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        .right-panel button:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        /* 通知弹窗 */
        .notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #3966A2;
            color: #F8F6F6;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(19, 40, 67, 0.18);
            z-index: 1000;
            transition: top 0.5s ease;
        }

        .notification.show {
            top: 20px;
        }

        .notification.success {
            background-color: #3966A2;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes lineGrow {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 1;
            }
            20% {
                transform: scale(25, 25);
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(40, 40);
            }
        }

        @keyframes shake {
            10%, 90% {
                transform: translate3d(-1px, 0, 0);
            }
            20%, 80% {
                transform: translate3d(2px, 0, 0);
            }
            30%, 50%, 70% {
                transform: translate3d(-4px, 0, 0);
            }
            40%, 60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        /* 免责声明样式 */
        .disclaimer {
            background-color: #F8F6F6;
            border-left: 3px solid #3966A2;
            padding: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #3966A2;
            border-radius: 0 3px 3px 0;
            width: 60%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <img class="login-logo" src="{{ url_for('static', filename='logo/logo1.png') }}" alt="finsightpro login logo">
        <h1>登录</h1>
    </div>
    <div class="right-panel">
        <h2>LOGIN</h2>
        <form id="loginForm" action="javascript:void(0);">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="账户" required>
                <div class="error-message" id="usernameError">请输入用户名</div>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="密码" required>
                <div class="error-message" id="passwordError">请输入密码</div>
            </div>
            <button type="submit">登录</button>
            <button type="button" onclick="window.location.href='{{ url_for('auth.register') }}'">注册</button>
        </form>
        <div class="disclaimer">
            <strong>免责声明</strong>：本平台提供的内容仅供参考，可能不准确、不完整或具有误导性。用户应自行核实信息，并在必要时咨询专业人士的意见。
        </div>
    </div>

    <div class="notification" id="notification">错误信息将显示在这里</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const notification = document.getElementById('notification');

            // 检查URL参数是否有错误信息
            const urlParams = new URLSearchParams(window.location.search);
            const errorMsg = urlParams.get('error');
            
            if (errorMsg) {
                showNotification(decodeURIComponent(errorMsg));
            }

            // 表单提交验证
            loginForm.addEventListener('submit', function(event) {
                let isValid = true;

                // 验证用户名
                if (!usernameInput.value.trim()) {
                    showError(usernameInput, usernameError, '请输入用户名');
                    isValid = false;
                } else {
                    hideError(usernameInput, usernameError);
                }

                // 验证密码
                if (!passwordInput.value) {
                    showError(passwordInput, passwordError, '请输入密码');
                    isValid = false;
                } else {
                    hideError(passwordInput, passwordError);
                }

                if (isValid) {
                    // 使用fetch API进行AJAX请求
                    fetch('{{ url_for("auth.login") }}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            'username': usernameInput.value,
                            'password': passwordInput.value
                        })
                    })
                    .then(response => {
                        if (response.redirected) {
                            // 登录成功，跳转到重定向的URL
                            window.location.href = response.url;
                        } else {
                            // 检查是否有错误消息
                            return response.text();
                        }
                    })
                    .then(data => {
                        if (data) {
                            // 如果响应包含"账号或密码错误"，显示错误通知
                            if (data.includes('账号或密码错误') || data.includes('错误')) {
                                showNotification('账号或密码错误');
                                passwordInput.classList.add('shake');
                                setTimeout(() => {
                                    passwordInput.classList.remove('shake');
                                }, 500);
                            } else if (data.includes('<!DOCTYPE html>')) {
                                // 从HTML响应中提取可能的错误消息
                                const parser = new DOMParser();
                                const htmlDoc = parser.parseFromString(data, 'text/html');
                                const errorText = htmlDoc.querySelector('body').textContent.trim();
                                if (errorText) {
                                    showNotification(errorText);
                                }
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showNotification('登录过程中发生错误，请重试');
                    });
                }
            });

            // 输入框获取焦点时隐藏错误
            usernameInput.addEventListener('focus', function() {
                hideError(usernameInput, usernameError);
            });

            passwordInput.addEventListener('focus', function() {
                hideError(passwordInput, passwordError);
            });

            // 辅助函数
            function showError(input, errorElement, message) {
                input.classList.add('shake');
                errorElement.textContent = message;
                errorElement.classList.add('show');
                
                // 移除抖动动画，以便可以再次触发
                setTimeout(() => {
                    input.classList.remove('shake');
                }, 500);
            }

            function hideError(input, errorElement) {
                errorElement.classList.remove('show');
            }

            function showNotification(message, isSuccess = false) {
                notification.textContent = message;
                notification.classList.toggle('success', isSuccess);
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 5000);
            }
        });
    </script>
</body>
</html>
