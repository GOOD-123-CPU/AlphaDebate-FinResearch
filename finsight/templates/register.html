<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finsightpro 注册</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #D6DEEB 40%, #F8F6F6 60%);
            overflow: hidden;
        }

        /* 左侧面板 */
        .left-panel {
            flex: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #D6DEEB;
            position: relative;
            overflow: hidden;
        }

        .left-panel h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 6rem;
            color: #132843;
            margin: 0;
            white-space: nowrap;
            animation: fadeIn 1.2s ease-in-out;
            position: relative;
        }

        .left-panel h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 0;
            height: 4px;
            background-color: #132843;
            animation: lineGrow 1.5s ease-in-out forwards;
            animation-delay: 0.8s;
        }

        /* 右侧面板 */
        .right-panel {
            flex: 6;
            position: relative;
            background-color: #F8F6F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: slideIn 1s ease-in-out;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            left: -50px;
            top: 0;
            bottom: 0;
            width: 100px;
            background: linear-gradient(to right, 
                #D6DEEB 0%, 
                #F8F6F6 100%
            );
            border-radius: 0 100% 100% 0;
            box-shadow: 5px 0 15px rgba(19,40,67,0.12);
        }

        .right-panel h2 {
            font-family: 'Brush Script MT', cursive;
            font-size: 4rem;
            margin: 0;
            color: #132843;
            animation: fadeInUp 1s ease-in-out;
        }

        .right-panel form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60%;
            margin-top: 40px;
        }

        .input-group {
            width: 100%;
            position: relative;
            margin-bottom: 20px;
        }

        .right-panel input {
            width: 100%;
            padding: 15px 0;
            margin: 8px 0;
            border: none;
            border-bottom: 2px solid #6191D3;
            font-size: 1rem;
            background: transparent;
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease-in-out;
            animation-fill-mode: both;
        }

        .right-panel input:nth-child(1) {
            animation-delay: 0.2s;
        }

        .right-panel input:nth-child(2) {
            animation-delay: 0.4s;
        }

        .right-panel input:nth-child(3) {
            animation-delay: 0.6s;
        }

        .right-panel input:focus {
            outline: none;
            border-bottom: 2px solid #132843;
            transform: translateY(-5px);
        }

        .error-message {
            color: #3966A2;
            font-size: 0.8rem;
            position: absolute;
            bottom: -20px;
            left: 0;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .password-strength {
            width: 100%;
            height: 5px;
            background-color: #D6DEEB;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background-color: #3966A2;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .password-strength-bar.weak {
            background-color: #3966A2;
            width: 33.33%;
        }

        .password-strength-bar.medium {
            background-color: #6191D3;
            width: 66.66%;
        }

        .password-strength-bar.strong {
            background-color: #3966A2;
            width: 100%;
        }

        .password-match-icon {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #6191D3;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .password-match-icon.match {
            opacity: 1;
            color: #3966A2;
        }

        .password-match-icon.mismatch {
            opacity: 1;
            color: #3966A2;
        }

        .right-panel button {
            width: 100%;
            padding: 15px 0;
            margin: 25px 0 15px 0;
            background-color: #6191D3;
            border: none;
            color: #F8F6F6;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-in-out;
            animation-delay: 0.8s;
            animation-fill-mode: both;
        }

        .right-panel button:hover {
            background-color: #3966A2;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(57, 102, 162, 0.24);
        }

        .right-panel button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(57, 102, 162, 0.24);
        }

        .right-panel button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(248, 246, 246, 0.55);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        .right-panel button:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        .return-button {
            margin-top: 10px;
            color: #132843;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
            padding-bottom: 2px;
            font-size: 0.9rem;
        }

        .return-button::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 50%;
            background-color: #132843;
            transition: all 0.3s ease;
        }

        .return-button:hover::after {
            width: 100%;
            left: 0;
        }

        /* 通知弹窗 */
        .notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #3966A2;
            color: #F8F6F6;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(19, 40, 67, 0.18);
            z-index: 1000;
            transition: top 0.5s ease;
        }

        .notification.show {
            top: 20px;
        }

        .notification.success {
            background-color: #3966A2;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes lineGrow {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 1;
            }
            20% {
                transform: scale(25, 25);
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(40, 40);
            }
        }

        @keyframes shake {
            10%, 90% {
                transform: translate3d(-1px, 0, 0);
            }
            20%, 80% {
                transform: translate3d(2px, 0, 0);
            }
            30%, 50%, 70% {
                transform: translate3d(-4px, 0, 0);
            }
            40%, 60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        /* 免责声明样式 */
        .disclaimer {
            background-color: #F8F6F6;
            border-left: 3px solid #3966A2;
            padding: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #3966A2;
            border-radius: 0 3px 3px 0;
            width: 60%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <h1>02 注册</h1>
    </div>
    <div class="right-panel">
        <h2>CREATE ACCOUNT</h2>
        <form id="registerForm" action="javascript:void(0);">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="账户" required>
                <div class="error-message" id="usernameError">请输入用户名</div>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="密码" required>
                <div class="error-message" id="passwordError">请输入密码</div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="passwordStrengthBar"></div>
                </div>
            </div>
            
            <div class="input-group">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="确认密码" required>
                <div class="error-message" id="confirmPasswordError">请确认密码</div>
                <span class="password-match-icon" id="passwordMatchIcon">✓</span>
            </div>
            
            <button type="submit">注册</button>
            <a href="{{ url_for('auth.login') }}" class="return-button">返回登录</a>
        </form>
        <div class="disclaimer">
            <strong>免责声明</strong>：本平台提供的内容仅供参考，可能不准确、不完整或具有误导性。用户应自行核实信息，并在必要时咨询专业人士的意见。
        </div>
    </div>

    <div class="notification" id="notification">错误信息将显示在这里</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            const passwordStrengthBar = document.getElementById('passwordStrengthBar');
            const passwordMatchIcon = document.getElementById('passwordMatchIcon');
            const notification = document.getElementById('notification');

            // 检查URL参数是否有错误信息
            const urlParams = new URLSearchParams(window.location.search);
            const errorMsg = urlParams.get('error');
            
            if (errorMsg) {
                showNotification(decodeURIComponent(errorMsg));
            }

            // 密码强度检查
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;
                
                // 长度检查
                if (password.length >= 8) strength += 1;
                
                // 复杂性检查
                if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 1;
                if (/[0-9]/.test(password)) strength += 1;
                if (/[^A-Za-z0-9]/.test(password)) strength += 1;
                
                // 更新强度指示器
                passwordStrengthBar.className = 'password-strength-bar';
                if (password.length === 0) {
                    passwordStrengthBar.style.width = '0%';
                } else if (strength <= 2) {
                    passwordStrengthBar.classList.add('weak');
                } else if (strength === 3) {
                    passwordStrengthBar.classList.add('medium');
                } else {
                    passwordStrengthBar.classList.add('strong');
                }
                
                // 检查密码确认
                checkPasswordMatch();
            });
            
            // 确认密码匹配检查
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
            
            function checkPasswordMatch() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                passwordMatchIcon.className = 'password-match-icon';
                
                if (confirmPassword.length === 0) {
                    passwordMatchIcon.classList.remove('match', 'mismatch');
                } else if (password === confirmPassword) {
                    passwordMatchIcon.classList.add('match');
                    passwordMatchIcon.textContent = '✓';
                    hideError(confirmPasswordInput, confirmPasswordError);
                } else {
                    passwordMatchIcon.classList.add('mismatch');
                    passwordMatchIcon.textContent = '✗';
                }
            }

            // 表单提交验证
            registerForm.addEventListener('submit', function(event) {
                let isValid = true;

                // 验证用户名
                if (!usernameInput.value.trim()) {
                    showError(usernameInput, usernameError, '请输入用户名');
                    isValid = false;
                } else if (usernameInput.value.trim().length < 3) {
                    showError(usernameInput, usernameError, '用户名至少需要3个字符');
                    isValid = false;
                } else {
                    hideError(usernameInput, usernameError);
                }

                // 验证密码
                if (!passwordInput.value) {
                    showError(passwordInput, passwordError, '请输入密码');
                    isValid = false;
                } else if (passwordInput.value.length < 6) {
                    showError(passwordInput, passwordError, '密码至少需要6个字符');
                    isValid = false;
                } else {
                    hideError(passwordInput, passwordError);
                }

                // 验证确认密码
                if (!confirmPasswordInput.value) {
                    showError(confirmPasswordInput, confirmPasswordError, '请确认密码');
                    isValid = false;
                } else if (passwordInput.value !== confirmPasswordInput.value) {
                    showError(confirmPasswordInput, confirmPasswordError, '两次输入的密码不匹配');
                    isValid = false;
                } else {
                    hideError(confirmPasswordInput, confirmPasswordError);
                }

                // 如果表单验证通过，提交注册请求
                if (isValid) {
                    // 使用fetch API进行AJAX请求
                    fetch('{{ url_for("auth.register") }}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            'username': usernameInput.value,
                            'password': passwordInput.value,
                            'confirmPassword': confirmPasswordInput.value
                        })
                    })
                    .then(response => {
                        if (response.redirected) {
                            // 注册成功，跳转到重定向的URL
                            window.location.href = response.url;
                        } else {
                            // 检查是否有错误消息
                            return response.text();
                        }
                    })
                    .then(data => {
                        if (data) {
                            // 检查常见的错误情况
                            if (data.includes('用户名已存在')) {
                                showError(usernameInput, usernameError, '用户名已存在');
                            } else if (data.includes('密码不匹配') || data.includes('两次输入的密码不一致')) {
                                showError(confirmPasswordInput, confirmPasswordError, '两次输入的密码不匹配');
                            } else if (data.includes('<!DOCTYPE html>')) {
                                // 从HTML响应中提取可能的错误消息
                                const parser = new DOMParser();
                                const htmlDoc = parser.parseFromString(data, 'text/html');
                                const errorText = htmlDoc.querySelector('body').textContent.trim();
                                if (errorText) {
                                    showNotification(errorText);
                                }
                            } else {
                                // 其他未知错误
                                showNotification('注册失败，请检查您的输入');
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showNotification('注册过程中发生错误，请重试');
                    });
                }
            });

            // 输入框获取焦点时隐藏错误
            usernameInput.addEventListener('focus', function() {
                hideError(usernameInput, usernameError);
            });

            passwordInput.addEventListener('focus', function() {
                hideError(passwordInput, passwordError);
            });

            confirmPasswordInput.addEventListener('focus', function() {
                hideError(confirmPasswordInput, confirmPasswordError);
            });

            // 辅助函数
            function showError(input, errorElement, message) {
                input.classList.add('shake');
                errorElement.textContent = message;
                errorElement.classList.add('show');
                
                // 移除抖动动画，以便可以再次触发
                setTimeout(() => {
                    input.classList.remove('shake');
                }, 500);
            }

            function hideError(input, errorElement) {
                errorElement.classList.remove('show');
            }

            function showNotification(message, isSuccess = false) {
                notification.textContent = message;
                notification.classList.toggle('success', isSuccess);
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 5000);
            }
        });
    </script>
</body>
</html>
